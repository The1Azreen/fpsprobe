name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fpsprobe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fpsprobe
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: fpsprobe-windows-x64
          path: |
            fpsprobe/target/release/fpsprobe.exe
            fpsprobe/target/release/fpsprobe-gui.exe
            LICENSE
            fpsprobe/assets/fonts/OFL.txt
